# Render blueprint: the refund copilot as one web service (API + built UI, one origin).
# New → Blueprint → pick this repo. AI_STUB=1 runs it without an API key; to use the
# real model, set ANTHROPIC_API_KEY in the dashboard and remove AI_STUB.
services:
  - type: web
    name: refund-copilot
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production below would otherwise skip vite and tsx.
    buildCommand: npm ci --include=dev && npm run build --workspace apps/refund-copilot
    startCommand: npm start --workspace apps/refund-copilot
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: AI_STUB
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
